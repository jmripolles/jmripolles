<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8" />
<title>IES Maestrat — Cicles Formatius d'Administració i Gestió</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<meta name="ext-resource-dependency" content="assets/logo-ies-maestrat.png" data-resource-id="logoIes" />
<meta name="ext-resource-dependency" content="assets/erasmus.png" data-resource-id="erasmus" />
<meta name="ext-resource-dependency" content="assets/gva.svg" data-resource-id="gva" />
<meta name="ext-resource-dependency" content="assets/fpcv.jpg" data-resource-id="fpcv" />

<style>
  html,body { margin:0; padding:0; height:100%; background:#f4f1e8; overflow:hidden; }
  *, *::before, *::after { box-sizing: border-box; }
</style>

<template id="__bundler_thumbnail" data-bg-color="#0f3d33">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0f3d33"/>
    <g transform="translate(600,400)" fill="none" stroke="#e4c99a" stroke-width="14" stroke-linecap="round">
      <circle r="180" stroke="#6fb5ac" opacity="0.45"/>
      <path d="M -140 60 L 0 -120 L 140 60" stroke="#e4c99a"/>
      <path d="M -90 60 L -90 10 L 90 10 L 90 60" stroke="#e4c99a"/>
      <path d="M -60 60 L -60 40 L 60 40 L 60 60" stroke="#e4c99a"/>
    </g>
    <g transform="translate(600,640)" text-anchor="middle" font-family="serif" font-size="44" fill="#f4f1e8" font-weight="700">
      <text>IES MAESTRAT</text>
    </g>
    <g transform="translate(600,690)" text-anchor="middle" font-family="monospace" font-size="20" fill="#6fb5ac" letter-spacing="6">
      <text>CICLES FORMATIUS</text>
    </g>
  </svg>
</template>
</head>
<body>
<div id="root" style="position:absolute;inset:0"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="scenes.standalone.jsx"></script>

<script type="text/babel">
  function App() {
    return (
      <div data-video-root data-screen-label="t=0s" style={{ position:'absolute', inset:0 }}>
        <Stage width={1920} height={1080} duration={62} background="#f4f1e8" persistKey="ies-maestrat-video-v2">
          <TimeLabel />
          <Scene1 />
          <Scene2 />
          <Scene3 />
          <Scene4 />
          <Scene5 />
          <Scene6 />
          <Scene7 />
        </Stage>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
