<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8" />
<title>IES Maestrat — Cicles Formatius d'Administració i Gestió</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="ext-resource-dependency" content="./assets/logo-ies-maestrat.png" data-resource-id="logoIes" />
<meta name="ext-resource-dependency" content="./animations.jsx" data-resource-id="animationsJsx" />
<meta name="ext-resource-dependency" content="./scenes.jsx" data-resource-id="scenesJsx" />
<style>
  html,body { margin:0; padding:0; height:100%; background:#0a0a0a; overflow:hidden; }
  *, *::before, *::after { box-sizing: border-box; }
</style>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#f4f1e8">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#f4f1e8"/>
    <text x="100" y="340" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="120" fill="#1f3a3a" letter-spacing="-3">Cicles</text>
    <text x="100" y="470" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="120" fill="#2f8a8a" letter-spacing="-3">formatius.</text>
    <text x="100" y="560" font-family="monospace" font-size="28" fill="#3a5555" letter-spacing="4">IES MAESTRAT · ADM. I GESTIÓ</text>
    <circle cx="1000" cy="220" r="80" fill="none" stroke="#5ea34d" stroke-width="10"/>
    <circle cx="1000" cy="220" r="40" fill="#2f8a8a"/>
  </svg>
</template>
<div id="root" style="position:absolute;inset:0"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="scenes.jsx"></script>

<script type="text/babel">
  function App() {
    return (
      <div data-video-root data-screen-label="t=0s" style={{ position:'absolute', inset:0 }}>
        <Stage width={1920} height={1080} duration={62} background="#f4f1e8" persistKey="ies-maestrat-video-v2">
          <TimeLabel />
          <Scene1 />
          <Scene2 />
          <Scene3 />
          <Scene4 />
          <Scene5 />
          <Scene6 />
          <Scene7 />
        </Stage>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
