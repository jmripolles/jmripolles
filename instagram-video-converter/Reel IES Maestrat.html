<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8" />
<title>IES Maestrat — Reel vertical</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  html,body { margin:0; padding:0; height:100%; background:#0a0a0a; overflow:hidden; }
  *, *::before, *::after { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root" style="position:absolute;inset:0"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="scenes.vertical.jsx"></script>

<script type="text/babel">
  function App() {
    return (
      <div data-video-root data-screen-label="t=0s" style={{ position:'absolute', inset:0 }}>
        <Stage width={1080} height={1920} duration={62} background="#f4f1e8" persistKey="ies-maestrat-reel-v1">
          <VTimeLabel />
          <VScene1 />
          <VScene2 />
          <VScene3 />
          <VScene4 />
          <VScene5 />
          <VScene6 />
          <VScene7 />
        </Stage>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
